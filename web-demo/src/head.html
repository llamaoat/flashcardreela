<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reelcards Engine</title>
<meta name="theme-color" content="#0f1014">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reelcards">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&family=Caveat:wght@600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=JetBrains+Mono:wght@400;600&family=Roboto:wght@400;500;700;900&family=TikTok+Sans:wght@400;600;800;900&display=swap">
<style>
:root{
  color-scheme: dark;
  --ground:#0f1014; --panel:#17181e; --panel2:#1e1f27; --line:#2a2c37;
  --text:#ecebe6; --muted:#9c9ca9; --accent:#ffe14d; --good:#3ecf8e; --bad:#ff5a76; --warn:#ffb547;
  --display:'Anton', Impact, 'Arial Narrow', sans-serif;
  --body:'Inter', system-ui, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, Menlo, monospace;
  --f-tiktok:'TikTok Sans', 'Bricolage Grotesque', system-ui, sans-serif;
  --f-youtube:'Roboto', system-ui, sans-serif;
  --f-instagram: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
html,body{background:var(--ground);color:var(--text)}
body{font-family:var(--body);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:20px 40px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--serif);font-weight:500;font-size:42px;line-height:1;letter-spacing:-.5px;margin:0}
h1 span{color:var(--accent)}
.sub{color:var(--muted);max-width:68ch;margin:6px 0 0}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:88px}
.stat b{display:block;font-family:var(--mono);font-size:18px;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.main{display:grid;grid-template-columns:380px minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:940px){.main{grid-template-columns:minmax(0,1fr)}}
.phonecol{display:flex;flex-direction:column;gap:10px;align-items:center;position:sticky;top:12px}
@media (max-width:940px){.phonecol{position:static}}
.hostbar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.hostbar button,.chipbtn{min-height:34px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:12.5px;font-weight:600}
.hostbar button.on,.chipbtn.on{background:var(--accent);border-color:var(--accent);color:#141208}
.phone{width:360px;max-width:100%;aspect-ratio:360/740;border-radius:42px;border:8px solid #25262e;background:#000;position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;box-shadow:0 30px 60px -30px #000}
.phone.feedmode{touch-action:none}
.screen{position:absolute;inset:0;overflow:hidden;container-type:size}
.screen.enter{animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(38%);opacity:.4}to{transform:none;opacity:1}}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
button{font-family:var(--body);cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{min-height:44px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);color:#141208;border-color:var(--accent);font-weight:800}
.btn:disabled{opacity:.5;cursor:default}
.hint{color:var(--muted);font-size:12px;text-align:center;max-width:360px;margin:0}
.panels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:1140px){.panels{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel.wide{grid-column:1/-1}
.panel > h2{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}
.panel > h2 .note{text-transform:none;letter-spacing:0;font-weight:400}
.why{display:flex;flex-direction:column;gap:8px;margin:0}
.why div{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px}
.why dt{font-family:var(--mono);font-size:11px;color:var(--accent);padding-top:2px}
.why dd{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-size:12px}
.dims{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:560px){.dims{grid-template-columns:minmax(0,1fr)}}
.dim h3{margin:0 0 6px;font-size:13px}
.piece{display:grid;grid-template-columns:118px minmax(0,1fr) 64px;gap:8px;align-items:center;font-size:12px;padding:2px 0}
.piece .bar{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden}
.piece .bar i{display:block;height:100%;background:var(--muted);border-radius:4px;transition:width .3s}
.piece.used .bar i{background:var(--accent)}
.piece.used .nm{color:var(--accent);font-weight:800}
.piece .ct{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;max-height:340px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:4px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600;background:var(--panel2);color:var(--muted)}
.chip.easy{background:#123a2a;color:var(--good)}.chip.good{background:#12303a;color:#6fd3ff}.chip.again{background:#3a1520;color:var(--bad)}.chip.hard{background:#3a2e10;color:var(--warn)}
.chip.due{background:#3a2e10;color:var(--warn)}
.log{font-family:var(--mono);font-size:11.5px;display:flex;flex-direction:column;gap:3px;max-height:160px;overflow:auto}
.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.controls{grid-template-columns:minmax(0,1fr)}}
label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
label output{color:var(--text);font-family:var(--mono)}
input[type=range]{accent-color:var(--accent);width:100%}
select{min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:0 10px;font-family:var(--body)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.kpi{background:var(--panel2);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-family:var(--mono);font-size:18px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-size:11px}
.arms{display:flex;gap:6px;align-items:flex-end;height:90px;padding-bottom:18px}
.arms div{flex:1;position:relative;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.arms i{display:block;background:var(--muted);border-radius:4px 4px 0 0}
.arms div.on i{background:var(--accent)}
.arms span{position:absolute;bottom:-16px;left:0;right:0;text-align:center;font-size:10px;font-family:var(--mono);color:var(--muted)}
.toggle{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text)}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}

/* ---------- design lab ---------- */
.lab{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:14px}
.lab figure{margin:0;display:flex;flex-direction:column;gap:6px}
.lab .mini{width:100%;aspect-ratio:360/740;border-radius:22px;border:5px solid #25262e;position:relative;overflow:hidden;background:#000}
.lab .mini .scaler{position:absolute;left:0;top:0;width:360px;height:740px;transform-origin:0 0}
.lab figcaption{font-size:11.5px;color:var(--muted);line-height:1.35}
.lab figcaption b{color:var(--text);font-weight:600}
.labbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* ---------- in-phone app (setup + dashboard) ----------
   Quiet and light by day, dark when the phone is: off-white or near-black ground, ink buttons,
   a black line over a grey line for headings. Same tokens as Ui.java. */
.app,.tabs.ondash{--ground:#FAFAF8;--panel:#FFFFFF;--panel2:#F2F2EF;--line:#E6E5E0;--text:#111111;--muted:#8A8A85;--accent:#111111;--onaccent:#FFFFFF;
  --good:#1F9D63;--bad:#D93A50;--goodbg:#EAF6EF;--selbg:#F2F2EF;--bar2:#D9D8D3;color-scheme:light;color:var(--text)}
@media (prefers-color-scheme:dark){.app,.tabs.ondash{--ground:#0E0E0D;--panel:#181816;--panel2:#20201E;--line:#2B2B28;--text:#F2F1EC;--muted:#8E8D87;--accent:#F2F1EC;--onaccent:#111111;
  --good:#3ECF8E;--bad:#FF6B80;--goodbg:#142019;--selbg:#22221F;--bar2:#3A3A36;color-scheme:dark}}
.app{position:absolute;inset:0;background:var(--ground);overflow-y:auto;padding:30px 20px 26px;display:flex;flex-direction:column;gap:10px;scrollbar-width:none;font-family:var(--body);letter-spacing:-.1px}
.app::-webkit-scrollbar{display:none}
.app h3{font-family:var(--body);font-weight:600;font-size:24px;line-height:1.2;letter-spacing:-.6px;margin:6px 0 0}
.app h3 span{display:block;color:var(--muted);font-weight:500}
.app p{margin:0;font-size:14px;color:var(--text)}
.app .muted{color:var(--muted)}
.steplbl{font-size:12px;color:var(--muted);font-weight:500}
.stepbar{display:flex;gap:4px}.stepbar i{flex:1;height:3px;border-radius:2px;background:var(--line)}.stepbar i.on{background:var(--accent)}
.choice{display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:56px;padding:11px 14px;border-radius:16px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-family:var(--body)}
.choice .t{flex:1;display:flex;flex-direction:column;gap:1px}
.choice .t b{font-size:14.5px;font-weight:500}
.choice .t small{font-size:12.5px;color:var(--muted)}
.choice .m{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--onaccent);font-size:12px}
.choice.on{border-color:var(--accent);background:var(--selbg)}
.choice.on .m{background:var(--accent);border-color:var(--accent)}
.choice:disabled{opacity:.5}
.vchips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.vchips button{min-height:44px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:12.5px;font-weight:500;padding:4px;font-family:var(--body)}
.vchips button.on{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.sec{font-size:12px;color:var(--muted);font-weight:500;margin-top:10px}
.abtn{min-height:46px;border-radius:999px;border:1px solid var(--accent);background:var(--accent);color:var(--onaccent);font-family:var(--body);font-weight:500;font-size:15px;letter-spacing:-.1px;margin-top:6px;padding:0 20px}
.abtn.ghost{background:var(--panel);color:var(--text);border:1px solid var(--line);font-weight:500;font-size:14px}
.alink{background:none;border:none;color:var(--text);text-decoration:underline;text-underline-offset:3px;font-weight:500;padding:10px 0;text-align:left;min-height:44px;font-size:13.5px;font-family:var(--body)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.box b{font-size:14px;font-weight:600}
.err{color:var(--bad);font-size:13px;min-height:1em}
.app textarea{width:100%;min-height:140px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:12px;font-family:var(--body);font-size:13.5px;resize:vertical;box-sizing:border-box}
.app input[type=text]{width:100%;min-height:44px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:0 12px;font-family:var(--body);font-size:14px;box-sizing:border-box}
.mini2{font-size:13px;background:var(--panel2);border-radius:12px;padding:8px 12px}
.num{display:flex;gap:10px;align-items:flex-start;font-size:13.5px}.num i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--onaccent);font-weight:600;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.seg{display:flex;gap:4px;background:var(--panel2);border-radius:999px;padding:3px}.seg button{flex:1;min-height:38px;border-radius:999px;border:none;background:none;color:var(--text);font-weight:500;font-size:12.5px;font-family:var(--body)}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.tile b{display:block;font-family:var(--body);font-weight:600;font-size:26px;line-height:1.1;letter-spacing:-.8px;font-variant-numeric:tabular-nums}
.tile small{color:var(--muted);font-size:12px}
.status{border-radius:16px;padding:12px 14px;border:1px solid var(--line);background:var(--panel)}
.status b{color:var(--text);font-family:var(--body);font-weight:600;font-size:15px}
.status b::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:8px;vertical-align:1px}
.bars{display:flex;align-items:flex-end;gap:4px;height:84px;padding-bottom:16px;position:relative}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative}
.bars div i{display:block;border-radius:3px 3px 0 0}
.bars div span{position:absolute;bottom:-15px;left:0;right:0;text-align:center;font-size:9.5px;color:var(--muted);font-variant-numeric:tabular-nums}
/* the moving hero: a soft orb and a wheel of topics rolling along a curve (motion() in app.js) */
.hero{position:relative;height:300px;margin:0 -20px;flex-shrink:0;overflow:hidden}
.hero.small{height:220px;margin-top:-6px}
.hero canvas{position:absolute;left:-64px;top:50%;width:190px;height:190px;transform:translateY(-50%)}
.hero.small canvas{width:150px;height:150px;left:-50px}
.hero .w{position:absolute;left:0;top:0;font-size:18px;font-weight:500;letter-spacing:-.3px;white-space:nowrap;color:var(--text);transform-origin:0 50%;will-change:transform,opacity}
.hero .w i{font-style:normal;color:var(--muted);font-weight:400}
.hero .w em{font-style:normal;color:var(--muted);font-weight:400;margin-left:8px}
.brand{font-weight:600;font-size:15px;letter-spacing:-.3px}
.tabs{position:absolute;top:10px;left:0;right:0;z-index:12;display:flex;justify-content:center;gap:18px;pointer-events:none}
.tabs button{pointer-events:auto;background:none;border:none;color:#ffffffa0;font-weight:800;font-size:14px;padding:6px 2px;min-height:34px;text-shadow:0 1px 3px #000}
.tabs button.on{color:#fff;border-bottom:2px solid #fff}
.tabs.ondash button{color:var(--muted);text-shadow:none;font-weight:500}.tabs.ondash button.on{color:var(--text);border-bottom-color:var(--text)}
.settings-sim{position:absolute;inset:0;background:#f4f4f6;color:#1b1b1f;z-index:20;display:flex;flex-direction:column;padding:28px 16px;gap:10px}
.settings-sim .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#6b6b75;font-weight:800}
.settings-sim .row2{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:14px;padding:14px;min-height:56px}
.switch{width:52px;height:30px;border-radius:15px;background:#c9c9d0;border:none;position:relative;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.switch.on{background:#2f6bff}.switch.on::after{left:25px}

/* ---------- plain reels (someone's normal feed) ---------- */
.reel{position:absolute;inset:0;overflow:hidden}
.plain-reel{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px}
.plain-reel .big{font-family:var(--display);font-size:40px;text-transform:uppercase;color:#ffffffd9}
.plain-reel .small{color:#ffffffa6;font-size:13px;max-width:24ch}

/* =================================================================================
   CARD REEL DESIGN SYSTEM
   A card is drawn exactly like a reel: full-bleed "video", text inside the host app's safe zone,
   the host's rail on the right, its caption band bottom-left, a thin progress line.
   ================================================================================= */
.card{position:absolute;inset:0;overflow:hidden;--st:5.6%;--sb:16.7%;--sl:5.6%;--sr:11.1%;
  --fg:#fff;--acc:#ffe14d;--accfg:#0e0e10;--panel:#1f1f24;--bubble:#2a2a30;--bgc:#0e0e10;--hf:var(--f-tiktok);
  background:var(--bgc);color:var(--fg);font-family:var(--hf)}
.card.h-tiktok{--st:5.6%;--sb:16.7%;--sl:5.6%;--sr:11.1%;--hf:var(--f-tiktok)}
.card.h-instagram{--st:10.9%;--sb:16.1%;--sl:3.7%;--sr:7.8%;--hf:var(--f-instagram)}
.card.h-youtube{--st:6.3%;--sb:15.6%;--sl:4.4%;--sr:8.9%;--hf:var(--f-youtube)}
.card .bgl{position:absolute;inset:0;z-index:0}
.card .scrim{position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,.62) 0%,rgba(0,0,0,0) 34%),linear-gradient(to bottom,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 18%)}
.card .body{position:absolute;z-index:3;box-sizing:border-box;left:calc(var(--sl) + 12px);right:calc(var(--sr) + 30px);top:calc(var(--st) + 44px);bottom:calc(var(--sb) + 104px);display:flex;flex-direction:column;gap:calc(14px * var(--fit,1));justify-content:flex-start;transition:filter .25s}
.card.l-split .body{top:44%;bottom:calc(var(--sb) + 96px)}
.card.l-bigtext .body,.card.l-captions .body{justify-content:center;padding-bottom:6%}
.card .splittop{position:absolute;left:0;right:0;top:0;height:42%;z-index:2;overflow:hidden;border-bottom:3px solid #000}

/* hook pill: the first thing read, top of the safe zone */
.card .hook{align-self:flex-start;max-width:100%;box-sizing:border-box;padding:7px 13px;border-radius:10px;font-size:calc(16.5px * var(--fit,1));font-weight:800;background:var(--panel);color:var(--fg);line-height:1.22;letter-spacing:-.1px}
.card .q{margin:0;line-height:1.02;overflow-wrap:normal;word-break:normal;hyphens:manual;font-weight:900}
.card .tag{display:inline}

/* ---- looks: text treatments borrowed from creator tools ---- */
/* caption: heavy captions, outlined for any background, key words in yellow */
.card.k-caption .q{font-family:var(--hf);font-weight:900;text-transform:uppercase;font-size:34px;letter-spacing:-.2px;
  text-shadow:0 0 1px #000,2px 2px 0 #000,-2px 2px 0 #000,2px -2px 0 #000,-2px -2px 0 #000,0 4px 10px rgba(0,0,0,.45)}
.card.k-caption .q em{font-style:normal;color:var(--acc)}
/* subtitle: text on rounded highlight boxes, one box per line (creator "text background" style) */
.card.k-subtitle .q{font-family:var(--hf);font-weight:800;font-size:27px;line-height:1.42}
.card.k-subtitle .q span{background:#fff;color:#111;padding:2px 9px;border-radius:8px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.card.k-subtitle .q em{font-style:normal;background:var(--acc);color:#111;border-radius:6px;padding:0 4px}
.card.k-subtitle .hook{background:#111;color:#fff}
/* clean: editorial serif on paper-white */
.card.k-clean .q{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:31px;line-height:1.08;letter-spacing:-.3px}
.card.k-clean .q em{font-style:italic;color:var(--acc)}
/* neon: glow */
.card.k-neon .q{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:36px;letter-spacing:.4px;line-height:1.1;text-shadow:0 0 18px var(--acc),0 0 3px #fff}
.card.k-neon .q em{font-style:normal;color:var(--acc)}
/* paper: handwritten notes on ruled paper */
.card.k-paper .q{font-family:'Caveat','Comic Sans MS',cursive;font-weight:700;font-size:40px;line-height:1.02}
.card.k-paper .q em{font-style:normal;background:linear-gradient(transparent 55%,color-mix(in srgb,var(--acc) 55%,transparent) 55%)}
/* sheet: light looks float as a notes page over the footage */
.card.sheet .body{background:var(--sheet);border-radius:18px;padding:18px 16px 16px;bottom:auto;max-height:calc(100% - var(--st) - 44px - var(--sb) - 104px);box-shadow:0 24px 48px -20px rgba(0,0,0,.85);transform:rotate(-.6deg)}
.card.sheet.l-bigtext .body,.card.sheet.l-captions .body{top:calc(var(--st) + 70px);max-height:calc(100% - var(--st) - 70px - var(--sb) - 104px)}
.card.sheet.rv.mp .body{top:calc(var(--st) + 44px);max-height:calc(100% - var(--st) - 44px - var(--sb) - 104px)}
.card.sheet.k-paper .body{background:linear-gradient(90deg,transparent 30px,rgba(228,87,46,.5) 30px,rgba(228,87,46,.5) 32px,transparent 32px),var(--sheet);padding-left:42px;--rule:rgba(47,107,255,.25)}
.card.sheet.k-paper.night .body{background:var(--sheet);padding-left:16px;--rule:rgba(255,255,255,.08)}
/* a rule under each line of handwriting, so the writing sits on the lines instead of being crossed by them (mirrors CardView's ruled body) */
.card.sheet.k-paper .q,.card.sheet.k-paper .pt .tx,.card.sheet.k-paper .beat{background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(.86lh - 1px),var(--rule) calc(.86lh - 1px),var(--rule) .86lh,transparent .86lh,transparent 1lh)}
/* chat bubbles carry their own surface: no sheet behind them, whatever the look */
.card.sheet.l-chat .body{background:none!important;box-shadow:none;padding:0!important;transform:none;bottom:calc(var(--sb) + 104px)}
.card.sheet .reveal{color:var(--fg);text-shadow:none}
.card.sheet .ring{background:rgba(255,255,255,.7)}
.card.sheet.night .ring{background:rgba(0,0,0,.3)}
.card .coach{position:absolute;z-index:9;left:calc(var(--sl) + 10px);right:calc(var(--sr) + 64px);bottom:calc(var(--sb) + 72px);background:rgba(255,255,255,.96);color:#111;font-size:13px;line-height:1.3;font-weight:800;padding:9px 14px;border-radius:16px;box-shadow:0 10px 24px -10px rgba(0,0,0,.7);animation:coach 4.2s ease forwards;pointer-events:none}
@keyframes coach{0%{opacity:0;transform:translateY(8px)}10%,80%{opacity:1;transform:none}100%{opacity:0}}

/* reveal ring + answer */
.card .snd{align-self:flex-start;background:var(--acc);color:var(--accfg,#111);border:none;border-radius:20px;padding:9px 18px 9px 16px;font:inherit;font-size:14px;font-weight:700;margin-top:12px;cursor:pointer}
.card .reveal{align-self:flex-start;display:flex;align-items:center;gap:10px;background:none;border:none;color:var(--fg);padding:0;font:inherit;font-size:14.5px;font-weight:700;min-height:56px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.card .hintchip{align-self:flex-start;max-width:100%;background:#fff;color:#111;border-radius:12px 12px 12px 4px;padding:7px 11px;font-size:14px;font-weight:700;box-shadow:0 8px 20px -10px rgba(0,0,0,.6);animation:drop .25s ease-out}
.card .hintchip b{color:#e4572e;margin-right:4px}
.card .ring{width:52px;height:52px;border-radius:50%;border:3px solid var(--acc);color:var(--acc);display:flex;align-items:center;justify-content:center;font-family:var(--hf);font-weight:900;font-size:22px;background:rgba(0,0,0,.25);position:relative}
.card .ring::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:3px solid transparent;border-top-color:#fff;animation:spin 3s linear forwards}
@keyframes spin{to{transform:rotate(1080deg)}}
.card .ans{padding:13px 15px;border-radius:16px;display:flex;flex-direction:column;gap:4px;background:var(--acc);color:var(--accfg);animation:drop .32s cubic-bezier(.2,1.4,.4,1);box-shadow:0 10px 24px -12px rgba(0,0,0,.6)}
@keyframes drop{from{transform:translateY(-10px) scale(.94);opacity:0}to{transform:none;opacity:1}}
.card .ans .a1{font-weight:900;font-size:calc(20px * var(--fit,1));line-height:1.15}
.card .ans .a2{font-size:calc(14.5px * var(--fit,1));line-height:1.35;font-weight:500}

/* captions: auto-caption beats, one at a time */
.card .q.keepcase,.card .beat.keepcase{text-transform:none} /* Na+, pH, mEq/L keep their capitals (RC.caseMatters) */
.card .beat{font-family:var(--hf);font-weight:900;font-size:40px;line-height:1.02;text-transform:uppercase;text-align:center;align-self:center;margin-top:14%;
  text-shadow:0 0 1px #000,3px 3px 0 #000,-3px 3px 0 #000,3px -3px 0 #000,-3px -3px 0 #000;animation:beat .18s ease-out}
.card .beat em{font-style:normal;color:var(--acc)}
.card.k-subtitle .beat{text-shadow:none}
.card.k-subtitle .beat span{background:#fff;color:#111;padding:2px 10px;border-radius:9px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.card.k-paper .beat{font-family:'Caveat',cursive;text-transform:none;text-shadow:none;color:var(--fg)}
.card.k-clean .beat{font-family:'Fraunces',serif;text-transform:none;text-shadow:none;font-size:34px}
@keyframes beat{from{transform:scale(.86);opacity:.2}to{transform:none;opacity:1}}
.card .beatcount{align-self:center;display:flex;gap:4px}.card .beatcount i{width:18px;height:3px;border-radius:2px;background:rgba(255,255,255,.35)}.card .beatcount i.on{background:#fff}

/* chat: a phone chat thread */
.card .chat{border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--panel);box-shadow:0 18px 40px -20px rgba(0,0,0,.7)}
.card .chathead{display:flex;align-items:center;gap:10px;padding-bottom:6px;border-bottom:1px solid rgba(127,127,127,.2);margin-bottom:2px}
.card .chathead i{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#ff8a3d,#ff3b5c);color:#fff;font-style:normal;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
.card .chathead b{display:block;font-size:14px}.card .chathead small{font-size:11px;opacity:.6}
.card .bub{max-width:84%;padding:8px 12px;border-radius:18px;font-size:14.5px;line-height:1.3;font-family:var(--hf)}
.card .bub.them{align-self:flex-start;border-bottom-left-radius:5px;background:var(--bubble);color:var(--fg)}
.card .bub.me{align-self:flex-end;border-bottom-right-radius:5px;background:var(--acc);color:var(--accfg);animation:drop .3s ease-out both}
.card .typing{align-self:flex-end;border:none;min-height:44px;padding:6px 18px;border-radius:18px;border-bottom-right-radius:5px;background:var(--acc);color:var(--accfg);font-weight:900;letter-spacing:3px;font-size:18px}
.card .typing span{display:inline-block;animation:dot 1s infinite}.card .typing span:nth-child(2){animation-delay:.15s}.card .typing span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{transform:none;opacity:.6}30%{transform:translateY(-4px);opacity:1}}

.card .chat{max-height:100%;min-height:0;box-sizing:border-box}
/* a chat that gets long scrolls its oldest messages off the top, like a real thread */
.card .msgs{display:flex;flex-direction:column;gap:6px;justify-content:flex-end;overflow:hidden;min-height:0;flex:1 1 auto}
.card .msgs.over{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 36px);mask-image:linear-gradient(to bottom,transparent 0,#000 36px)}
.card button.bub{border:none;font:inherit;font-family:var(--hf);font-size:14.5px;text-align:left;position:relative;cursor:pointer}
.card .bub .tb{position:absolute;top:-10px;left:-10px;width:22px;height:22px;border-radius:50%;background:var(--panel);color:var(--acc);border:2px solid var(--acc);font-style:normal;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;animation:pop2 .3s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop2{from{transform:scale(.2)}to{transform:none}}
.card .bub.late,.card .sysmsg{animation:drop .3s ease-out both}
.card .sysmsg{align-self:center;font-size:11.5px;font-weight:700;opacity:.75;padding:2px 0}

/* comment: "replying to" sticker */
.card .sticker{align-self:flex-start;max-width:92%;background:#fff;color:#111;border-radius:14px;padding:10px 12px;display:flex;gap:9px;align-items:flex-start;box-shadow:0 10px 26px -10px rgba(0,0,0,.6);transform:rotate(-1.5deg)}
.card .sticker i{width:26px;height:26px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,#6fd3ff,#2f6bff)}
.card .sticker small{display:block;font-size:11.5px;color:#666;font-weight:600}
.card .sticker span{font-size:15px;font-weight:700;line-height:1.25}

/* quiz: poll sticker */
.card .poll{background:#fff;color:#111;border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 14px 30px -14px rgba(0,0,0,.7)}
.card .poll .pq{font-weight:800;font-size:16px;line-height:1.25;padding:2px 4px 4px}
.card .opt{min-height:50px;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;border:2px solid #e3e3e8;background:#f4f4f6;color:#111;font:inherit;font-size:15.5px;font-weight:700;text-align:left;width:100%}
.card .opt .l{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;flex-shrink:0;background:#111;color:#fff}
.card .opt.right{border-color:#1fa463;background:#e3f7ec}.card .opt.right .l{background:#1fa463}
.card .opt.wrong{border-color:#e23b55;background:#fde7eb}.card .opt.wrong .l{background:#e23b55}
.card .opt.dim{opacity:.45}
.card .pollnote{font-size:13.5px;line-height:1.35;color:#333;padding:0 4px}

/* ---- long answers ----
   Points drop in one after another (the "3 things…" listicle), each with a tick for self-marking.
   A long question's set-up sits in a quoted box. The fit pass (data-fit) shrinks everything a step
   at a time if the content would spill out of the safe zone. */
.card[data-fit="1"]{--fit:.92}.card[data-fit="2"]{--fit:.84}.card[data-fit="3"]{--fit:.76}.card[data-fit="4"]{--fit:.68}.card[data-fit="5"]{--fit:.6}
/* the clamp clips at the padding edge, so the vertical space is transparent border: no half line shows under the last one */
.card .ctx{font-size:calc(15px * var(--fit,1));line-height:1.32;font-weight:600;padding:0 12px;border:8px solid transparent;border-left:3px solid var(--acc);border-right:0;background:var(--panel);border-radius:4px 12px 12px 4px;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:6;overflow:hidden;flex-shrink:0}
.card.rv.mp .ctx{-webkit-line-clamp:1;opacity:.8}
.card.sheet .ctx{background:rgba(127,127,127,.12)}
.card.k-subtitle .ctx{background:#111;color:#fff}
.card .marks{align-self:flex-start;font-size:12px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;padding:4px 10px;border-radius:8px;border:2px solid var(--acc);color:var(--acc);background:rgba(0,0,0,.35);line-height:1.2}
.card.sheet .marks{background:none}
.card.l-bigtext .marks,.card.l-captions .marks{align-self:flex-start}
.card.rv.mp .hook{display:none}
.card .pts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:calc(7px * var(--fit,1))}
.card .pts li{position:relative}
.card .pt{width:100%;display:flex;align-items:flex-start;gap:10px;text-align:left;box-sizing:border-box;padding:calc(9px * var(--fit,1)) 10px calc(9px * var(--fit,1)) 9px;border-radius:14px;border:2px solid transparent;
  background:var(--panel);color:var(--fg);font-family:var(--hf);font-weight:700;font-size:calc(var(--ptpx,16px) * var(--fit,1));line-height:1.24;cursor:pointer;
  animation:ptin .42s cubic-bezier(.2,1.25,.4,1) both;box-shadow:0 8px 20px -14px rgba(0,0,0,.7);transition:border-color .15s,background .15s}
@keyframes ptin{from{opacity:0;transform:translateY(12px) scale(.95)}to{opacity:1;transform:none}}
.card .pt .n{flex-shrink:0;min-width:24px;height:24px;border-radius:7px;background:var(--acc);color:var(--accfg);font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;font-family:var(--hf)}
.card .pt .tx{flex:1;min-width:0;padding-top:1px}
.card .pt .tx b{color:var(--acc);font-weight:900}
.card .pt .tk{flex-shrink:0;width:20px;height:20px;border-radius:50%;border:2px solid currentColor;opacity:.4;position:relative;margin-top:1px}
.card .pt.got{border-color:var(--acc)}
.card .pt.got .tk{opacity:1;background:var(--acc);border-color:var(--acc)}
.card .pt.got .tk::after{content:"";position:absolute;left:5.5px;top:1.5px;width:5px;height:10px;border:solid var(--accfg);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.card .pts.steps .n{border-radius:50%}
.card .pts.steps li:not(:last-child)::after{content:"";position:absolute;left:22px;top:calc(100% - 3px);height:calc(7px * var(--fit,1) + 6px);width:2px;background:var(--acc);z-index:1}
.card .pt.slot{animation:none;align-items:center;box-shadow:none;cursor:default}
.card .redact{display:block;height:.9em;border-radius:5px;background:repeating-linear-gradient(135deg,currentColor 0 5px,transparent 5px 9px);opacity:.32}
.card .hintx{opacity:.9;font-style:italic}
.card .selfcheck{align-self:flex-start;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;padding:5px 11px;border-radius:999px;background:rgba(0,0,0,.5);color:#fff;animation:ptin .42s ease both;text-shadow:none}
.card .selfcheck::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid currentColor;opacity:.7}
.card.sheet .selfcheck{background:rgba(127,127,127,.16);color:var(--fg)}
.card .selfcheck.on::before{background:var(--acc);border-color:var(--acc);opacity:1}
.card.settled .pt,.card.settled .selfcheck,.card.settled .bub.me,.card.settled .bub.late,.card.settled .sysmsg,.card.settled .ans{animation:none!important}
.card .ans.t2 .a1{font-size:calc(18px * var(--fit,1))}
.card .ans.t3 .a1{font-size:calc(16.5px * var(--fit,1));font-weight:800}
/* looks */
.card.k-caption .pt{background:rgba(0,0,0,.62)}
.card.k-subtitle .pt{background:#fff;color:#111}
.card.k-subtitle .pt .n{color:#111}
.card.k-subtitle .pt .tx b{color:#111;background:var(--acc);border-radius:4px;padding:0 3px}
.card.k-neon .pt{border-color:color-mix(in srgb,var(--acc) 45%,transparent);box-shadow:0 0 18px -6px var(--acc)}
.card.k-neon .pt.got{border-color:var(--acc)}
.card.sheet .pt{background:none;box-shadow:none;border:none;border-radius:8px;padding-left:2px;padding-right:4px;border-bottom:1.5px dashed rgba(127,127,127,.35)}
.card.sheet .pt.got{background:color-mix(in srgb,var(--acc) 16%,transparent);border-bottom-color:transparent}
.card.sheet .pt.slot{border-bottom-style:solid}
.card.k-clean .pt{font-family:'Fraunces',Georgia,serif;font-weight:600;line-height:1.2}
.card.k-paper .pt{font-family:'Caveat',cursive;font-weight:700;font-size:calc(var(--ptpx,16px) * 1.38 * var(--fit,1));line-height:1.02;padding-top:4px;padding-bottom:4px}
.card.k-paper .pt .n{background:none;color:var(--acc);font-family:'Caveat',cursive;font-size:25px;min-width:16px;height:auto;line-height:1}
.card.k-paper .pts.steps li:not(:last-child)::after{left:9px;opacity:.5}
.card.k-paper .pt .tx b{color:var(--fg);background:linear-gradient(transparent 55%,color-mix(in srgb,var(--acc) 45%,transparent) 55%)}
/* "more": the explanation opens over a dimmed card, like an expanded caption */
.card .band .morebtn{background:none;border:none;color:#fff;font:inherit;font-weight:800;padding:6px 4px;margin:-6px -4px;cursor:pointer;text-shadow:inherit}
.card .band .mtxt{font-weight:500}
.card.moreopen .band{max-height:52%;overflow-y:auto;z-index:8;scrollbar-width:none;font-size:15px;line-height:1.38}
.card.moreopen .scrim{background:linear-gradient(to top,rgba(0,0,0,.92) 0%,rgba(0,0,0,.78) 45%,rgba(0,0,0,.55) 100%);transition:background .25s}
.card.moreopen .body,.card.moreopen .vibe,.card.moreopen .badge{filter:brightness(.3) saturate(.6);opacity:.6}

/* ---- cards from Anki: pictures, image occlusion, cloze gaps ---- */
.card .gap{display:inline-block;min-width:2.3em;padding:0 .28em;margin:0 .04em;border-radius:.2em;background:var(--acc);color:var(--accfg);text-shadow:none;line-height:1.08;text-align:center;font-style:normal;vertical-align:baseline}
.card.k-paper .gap{background:none;color:var(--acc);border-bottom:.09em solid var(--acc);border-radius:0;min-width:2.6em}
.card.k-clean .gap{font-style:italic}
.card.k-neon .gap{box-shadow:0 0 14px var(--acc)}
.card .pic{position:relative;align-self:center;max-width:100%;border-radius:14px;overflow:hidden;line-height:0;background:#fff;flex-shrink:0;box-shadow:0 16px 34px -16px rgba(0,0,0,.75)}
.card.sheet .pic{box-shadow:0 0 0 1px rgba(127,127,127,.25)}
/* width from the aspect ratio (--r) within a width and height limit; occlusion pictures use the full width */
.card .pic{--mw:100%;--mh:220px;width:min(var(--mw), calc(var(--mh) * var(--fit,1) * var(--r,1.4)))}
.card .pic img{display:block;width:100%;height:100%;object-fit:fill}
.card .pic.io{--mw:calc(100% + var(--sr) + 18px);--mh:240px;align-self:flex-start}
.card.sheet .pic.io{--mw:100%}
.card.sheet .pic.io + .q{margin-top:2px}
.card .pic.apic{--mh:150px}
.card .pic svg{position:absolute;inset:0;width:100%;height:100%}
.card .pic .m{stroke:#1d1d1f;stroke-width:1.5;transition:fill-opacity .35s,stroke .35s}
.card .pic .m.o{fill:#f3e7c9}
.card .pic .m.t{fill:var(--acc);stroke:#111;stroke-width:2.5;animation:maskin .5s ease-out both}
.card .pic .m.t.open{fill-opacity:.12;stroke:var(--acc);stroke-width:3.5;animation:none}
@keyframes maskin{from{fill-opacity:.4}to{fill-opacity:1}}
.card .pic .iolabel{position:absolute;font:700 12px/1.1 var(--hf);color:#111;background:rgba(255,255,255,.88);padding:2px 5px;border-radius:4px;white-space:nowrap}
.card.l-bigtext.k-subtitle .pic,.card.l-bigtext.k-caption .pic{margin-top:2px}

/* the host app's rail: our four actions in the host's positions and icon style */
.card .rail{position:absolute;z-index:6;right:max(6px, calc(var(--sr) - 48px));bottom:calc(var(--sb) - 2px);display:flex;flex-direction:column;gap:14px;align-items:center}
.card .rail button{background:none;border:none;color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;font-size:11px;font-weight:700;min-width:50px;min-height:50px;padding:0;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.card .rail svg{width:32px;height:32px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
.card .rail .av{width:44px;height:44px;border-radius:50%;border:2px solid #fff;background:var(--acc);color:var(--accfg);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;position:relative;margin-bottom:6px}
.card .rail .av::after{content:"+";position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);width:18px;height:18px;border-radius:50%;background:#ff3b5c;color:#fff;font-size:14px;line-height:18px;text-align:center;font-weight:800}
.card.h-instagram .rail .av,.card.h-youtube .rail .av{display:none}
.card .rail .on svg{color:#ff3b5c}
.card .rail .saved svg{color:var(--acc)}

/* caption band: account, caption, sound line, bottom-left like the host app */
.card .band{position:absolute;z-index:5;left:calc(var(--sl) + 10px);right:calc(var(--sr) + 22px);bottom:calc(var(--sb) - 58px);display:flex;flex-direction:column;gap:5px;font-size:14px;line-height:1.3;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.55)}
.card .band .who{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.card .band .who .dot{width:28px;height:28px;border-radius:50%;background:var(--acc);color:var(--accfg);display:none;align-items:center;justify-content:center;font-size:12px;font-weight:900}
.card.h-instagram .band .who .dot,.card.h-youtube .band .who .dot{display:flex}
.card .band .pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:8px;border:1.5px solid currentColor;display:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42%;vertical-align:middle}
.card.h-instagram .band .pill{display:inline-block}
.card.h-youtube .band .pill{display:inline-block;background:#fff;color:#0f0f0f;border-color:#fff;border-radius:999px;text-shadow:none}
.card .band .sound{display:flex;align-items:center;gap:6px;font-size:12.5px;opacity:.95;white-space:nowrap;overflow:hidden}
.card .band .sound svg{width:14px;height:14px;flex-shrink:0}
.card .band .tags{font-weight:700;opacity:.95}
.card.h-youtube .band .title{order:-1;font-weight:600}
/* progress line */
.card .prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.28);z-index:7}
.card .prog i{display:block;height:100%;background:#fff;width:0;animation:prog 12s linear forwards}
.card.h-youtube .prog i{background:#ff2d55}
@keyframes prog{to{width:100%}}

/* vibe badges: small touches that match the reels they watch */
.card .vibe{position:absolute;z-index:4;left:calc(var(--sl) + 12px);top:calc(var(--st) + 6px);display:flex;align-items:center;gap:6px;font-family:var(--hf);font-size:12px;font-weight:800;letter-spacing:.3px}
.card .score{display:flex;border-radius:6px;overflow:hidden;box-shadow:0 4px 12px -4px rgba(0,0,0,.6)}
.card .score span{padding:4px 7px;background:#101418;color:#fff}.card .score b{padding:4px 8px;background:#fff;color:#101418;font-variant-numeric:tabular-nums}
.card .score .t{background:#1fa463}
.card .hud{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.55);color:#9dff6f;padding:4px 8px;border-radius:6px;font-family:var(--mono)}
.card .hud i{display:block;width:60px;height:6px;border-radius:3px;background:#2b3a2b;overflow:hidden}.card .hud i b{display:block;height:100%;background:#9dff6f;width:35%;transition:width .5s}
.card .vpill{padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.9);color:#111}
.card .eqmini{display:inline-flex;gap:2px;align-items:flex-end;height:11px}.card .eqmini i{width:3px;background:currentColor;animation:eq .8s infinite ease-in-out}
.card .eqmini i:nth-child(2){animation-delay:.2s}.card .eqmini i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:3px}50%{height:11px}}
.card .xp{position:absolute;z-index:8;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--mono);font-weight:800;font-size:22px;color:#9dff6f;text-shadow:0 2px 0 #000;animation:float 1s ease-out forwards;pointer-events:none}
@keyframes float{from{opacity:0;transform:translate(-50%,-30%)}20%{opacity:1}to{opacity:0;transform:translate(-50%,-120%)}}

/* floating things */
.card .badge{position:absolute;top:calc(var(--st) + 4px);right:calc(var(--sr) + 4px);z-index:8;font-size:12px;font-weight:900;padding:5px 11px;border-radius:999px;background:var(--acc);color:var(--accfg);animation:drop .25s ease-out}
.card .hintbub{position:absolute;z-index:9;right:calc(var(--sr) + 6px);bottom:calc(var(--sb) + 150px);max-width:62%;background:#fff;color:#111;border-radius:16px 16px 4px 16px;padding:9px 12px;font-size:14px;font-weight:700;box-shadow:0 10px 26px -10px rgba(0,0,0,.7);animation:drop .25s ease-out}
.card .hintbub small{display:block;font-size:11px;color:#777;font-weight:600}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:26%;z-index:15;background:rgba(20,20,24,.92);color:#fff;font-size:12.5px;font-weight:600;border-radius:999px;padding:8px 14px;pointer-events:none;transition:opacity .4s;white-space:nowrap}
.enginenote{position:absolute;left:10px;right:10px;top:48px;z-index:15;background:rgba(0,0,0,.8);color:#fff;font-family:var(--mono);font-size:10.5px;border-radius:10px;padding:7px 9px;pointer-events:none;transition:opacity .5s}
.bigheart{position:absolute;width:112px;height:112px;margin:-56px 0 0 -56px;z-index:10;pointer-events:none;animation:pop .65s ease-out forwards;color:#ff3b5c}
@keyframes pop{0%{transform:scale(.3) rotate(-12deg);opacity:0}30%{transform:scale(1.12) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:0}}

/* ---- backgrounds (stand-ins for looping footage) ---- */
.bg-satisfying{background:repeating-linear-gradient(135deg,#c9a4f2 0 22px,#b88de8 22px 44px);background-size:62px 62px;animation:slide 2.5s linear infinite}
.bg-satisfying::after{content:"";position:absolute;left:0;right:0;height:6px;background:rgba(255,255,255,.45);animation:blade 3.2s linear infinite}
@keyframes blade{from{top:-10px}to{top:100%}}
.bg-gameplay{background:linear-gradient(#64c7ff 0,#c9ecff 34%,#2d313b 34%);overflow:hidden}
.bg-gameplay::before{content:"";position:absolute;left:-40%;right:-40%;top:34%;bottom:-10%;transform:perspective(260px) rotateX(58deg);transform-origin:top;
  background:linear-gradient(90deg,#8a5a3c 0 12%,#3b3f4a 12% 33%,#f2f2f2 33% 34%,#3b3f4a 34% 66%,#f2f2f2 66% 67%,#3b3f4a 67% 88%,#8a5a3c 88%),
  repeating-linear-gradient(to bottom,transparent 0 40px,rgba(255,225,77,.9) 40px 48px);background-blend-mode:normal;background-size:100% 100%,100% 96px;animation:run .7s linear infinite}
.bg-gameplay::after{content:"";position:absolute;width:30px;height:38px;border-radius:8px 8px 4px 4px;background:#ff4fd8;left:46%;bottom:27%;box-shadow:0 0 0 3px #111,0 18px 0 -8px rgba(0,0,0,.35);animation:hop .45s ease-in-out infinite alternate}
@keyframes run{to{background-position:0 0,0 96px}}
@keyframes hop{to{transform:translateY(-34px)}}
.bg-citywalk{background:radial-gradient(circle at 20% 30%,#ffb54766 0 6px,transparent 7px),radial-gradient(circle at 70% 60%,#6fd3ff55 0 5px,transparent 6px),linear-gradient(#1b2233,#2d2438);background-size:70px 90px,90px 70px,100% 100%;animation:drift 5s linear infinite}
.bg-citywalk::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(90deg,#121722 0 12%,transparent 12% 14%,#121722 14% 29%,transparent 29% 31%,#121722 31% 44%,transparent 44% 46%,#121722 46% 64%,transparent 64% 66%,#121722 66% 84%,transparent 84% 86%,#121722 86%);-webkit-mask:linear-gradient(to top,#000 60%,transparent)}
.bg-pitch{background:repeating-linear-gradient(90deg,#2f8f45 0 40px,#2a8340 40px 80px);animation:pan 6s linear infinite}
.bg-pitch::after{content:"";position:absolute;inset:8% 10%;border:3px solid rgba(255,255,255,.75);border-radius:2px;background:radial-gradient(circle at 50% 50%,transparent 0 44px,rgba(255,255,255,.75) 44px 47px,transparent 47px),linear-gradient(to bottom,transparent calc(50% - 1.5px),rgba(255,255,255,.75) calc(50% - 1.5px) calc(50% + 1.5px),transparent calc(50% + 1.5px))}
.bg-glow{background:radial-gradient(circle at 30% 30%,#ffb3d9 0,transparent 45%),radial-gradient(circle at 70% 65%,#c9b3ff 0,transparent 50%),radial-gradient(circle at 50% 100%,#ffd9b3 0,transparent 55%),#2a1f2e;background-size:160% 160%;animation:glow 7s ease-in-out infinite alternate}
@keyframes glow{to{background-position:100% 60%,0 40%,50% 0,0 0}}
.bg-equalizer{background:linear-gradient(#150b26,#2a0f3d)}
.bg-equalizer::after{content:"";position:absolute;left:6%;right:6%;bottom:22%;height:40%;background:repeating-linear-gradient(90deg,#ff4fd8 0 10px,transparent 10px 16px);-webkit-mask:linear-gradient(to top,#000 0,#000 100%);animation:eqbg 1.1s ease-in-out infinite alternate;transform-origin:bottom;opacity:.8}
@keyframes eqbg{0%{clip-path:polygon(0 60%,10% 30%,20% 70%,30% 20%,40% 55%,50% 10%,60% 65%,70% 35%,80% 75%,90% 25%,100% 50%,100% 100%,0 100%)}100%{clip-path:polygon(0 30%,10% 70%,20% 20%,30% 60%,40% 15%,50% 55%,60% 25%,70% 70%,80% 30%,90% 60%,100% 20%,100% 100%,0 100%)}}
@keyframes slide{to{background-position:62px 62px,82px 82px}}
@keyframes drift{to{background-position:0 90px,0 -70px,0 0}}
@keyframes pan{to{background-position:80px 0}}
@media (prefers-reduced-motion:reduce){.screen.enter,.card *,.card .bgl,.card .bgl::after{animation:none!important;transition:none!important}}
/* Add to Home Screen: the offer on the page, and the app itself (opened from the home screen, or ?app=1):
   just the phone, filling the screen, with nothing of the demo around it */
.install{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:10px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:68ch}
.install[hidden]{display:none}
.install p{margin:0;flex:1 1 220px;font-size:13px}
.install b{color:var(--accent)}
.install .btn{min-height:40px;padding:8px 14px}
html.appmode,html.appmode body{height:100%;overflow:hidden;overscroll-behavior:none}
html.appmode body{margin:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
html.appmode .wrap{max-width:none;height:100%;gap:0}
html.appmode header,html.appmode .panels,html.appmode #h-lab,html.appmode .wrap>section,html.appmode .phonecol>:not(.phone):not(input){display:none}
html.appmode .main{display:block;height:100%}
html.appmode .phonecol{position:static;height:100%;gap:0}
html.appmode .phone{width:100%;max-width:none;height:100%;aspect-ratio:auto;border:0;border-radius:0;box-shadow:none}
