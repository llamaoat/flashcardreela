<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-__SCRIPT_HASH__'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-src https://www.youtube-nocookie.com https://www.tiktok.com; connect-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B2140">
<title>Reelcards Feed</title>
<link rel="icon" type="image/png" href="icons/icon-192.png">
<!--__FONT_LINK__-->
<style>
/*__CARD_CSS__*/
/* ---------- the feed page ---------- */
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#0B2140;color:#EEF2F8;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
a{color:#fff}
.setup{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 20px 60px;display:flex;flex-direction:column;gap:14px}
.setup h1{margin:6px 0 0;font-size:30px;font-weight:600;letter-spacing:-1px;line-height:1.1}
.setup h1 span{display:block;color:#8FA3C4;font-weight:500}
.setup p{margin:0;font-size:14px;line-height:1.5;color:#C9D5E8}
.setup .back{font-size:13px;color:#8FA3C4;text-decoration:none}
.box{background:#12294Dd9;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid #24406D;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.box h2{margin:0;font-size:13px;font-weight:600;color:#8FA3C4}
.notice{border-color:#C9A227;background:#2A2410}
.notice b{color:#FFE08A}
.notice label{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:#fff}
.notice input{width:20px;height:20px;margin-top:1px;accent-color:#fff;flex-shrink:0}
textarea,select{width:100%;background:#1A3560;color:#fff;border:1px solid #24406D;border-radius:12px;padding:10px 12px;font:inherit;font-size:14px}
textarea{min-height:110px;resize:vertical}
.decks{display:flex;flex-direction:column;gap:8px}
.decks label{display:flex;gap:10px;align-items:center;font-size:14px;color:#fff}
.decks input{width:18px;height:18px;accent-color:#fff}
.btn{min-height:46px;border-radius:999px;border:1px solid #fff;background:#fff;color:#0B2140;font-size:15px;font-weight:600;padding:0 20px}
.btn.ghost{background:transparent;color:#fff;border-color:#24406D;font-weight:500;font-size:14px}
.btn:disabled{opacity:.4;cursor:default}
.hint{font-size:12.5px;color:#8FA3C4}
.ok{color:#7EE0B0}.bad{color:#FF8FA3}
.hidden{display:none!important}
/* the feed */
.feed{position:fixed;inset:0;overflow-y:scroll;scroll-snap-type:y mandatory;overscroll-behavior:contain;z-index:1;-webkit-overflow-scrolling:touch}
.slide{height:100vh;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.vframe{position:relative;height:100%;width:min(100vw,calc(100dvh * 9 / 16));background:#05101f;display:flex;align-items:center;justify-content:center}
.vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ph{color:#8FA3C4;font-size:14px}
.vlabel{position:absolute;left:14px;bottom:max(14px,env(safe-area-inset-bottom));font-size:12px;color:#ffffffb0;background:#00000066;border-radius:999px;padding:4px 10px;pointer-events:none}
.topbar{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;z-index:30}
.topbar button{border:0;border-radius:999px;background:#000000a6;color:#fff;font-size:13px;font-weight:600;padding:9px 14px}
.cardslide{background:transparent}
.frame{--k:1;width:calc(360px * var(--k));height:calc(740px * var(--k));position:relative;border-radius:calc(22px * var(--k));overflow:hidden;box-shadow:0 30px 80px -20px #000}
.stage{position:absolute;left:0;top:0;width:360px;height:740px;transform:scale(var(--k));transform-origin:0 0}
.endslide{text-align:center;flex-direction:column;gap:12px;padding:30px}
</style>
</head>
<body>
<div id="app"></div>
<script>/*__SCRIPTS__*/</script>
</body>
</html>
