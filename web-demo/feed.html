<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-jIVOoRyTPUi7r65NJ0ZSb5EiEJJLXHfJUP1we7dflKs='; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-src https://www.youtube-nocookie.com https://www.tiktok.com; connect-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B2140">
<title>Reelcards Feed</title>
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&family=Caveat:wght@600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=JetBrains+Mono:wght@400;600&family=Roboto:wght@400;500;700;900&family=TikTok+Sans:wght@400;600;800;900&display=swap">
<style>
:root{
  /* The page around the phone uses the app's own colours: off-white and ink by day, near-black and
     off-white when the system is dark. Same tokens as .app below, Ui.java and the extension popup. */
  color-scheme: light dark;
  --ground:#FAFAF8; --panel:#FFFFFF; --panel2:#F2F2EF; --line:#E6E5E0;
  --text:#111111; --muted:#8A8A85; --accent:#111111; --onaccent:#FFFFFF; --good:#1F9D63; --bad:#D93A50; --warn:#B86E00;
  --chipgood:#EAF6EF; --chipblue:#E8F1FA; --chipbad:#FCEDEF; --chipwarn:#FFF4E0; --frame:#D9D8D3;
  --display:'Anton', Impact, 'Arial Narrow', sans-serif;
  --body:'Inter', system-ui, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, Menlo, monospace;
  --f-tiktok:'TikTok Sans', 'Bricolage Grotesque', system-ui, sans-serif;
  --f-youtube:'Roboto', system-ui, sans-serif;
  --f-instagram: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;}
/* =================================================================================
   CARD REEL DESIGN SYSTEM
   A card is drawn exactly like a reel: full-bleed "video", text inside the host app's safe zone,
   the host's rail on the right, its caption band bottom-left, a thin progress line.
   ================================================================================= */
.card{position:absolute;inset:0;overflow:hidden;--st:5.6%;--sb:16.7%;--sl:5.6%;--sr:11.1%;
  --fg:#fff;--acc:#ffe14d;--accfg:#0e0e10;--panel:#1f1f24;--bubble:#2a2a30;--bgc:#0e0e10;--hf:var(--f-tiktok);
  background:var(--bgc);color:var(--fg);font-family:var(--hf)}
.card.h-tiktok{--st:5.6%;--sb:16.7%;--sl:5.6%;--sr:11.1%;--hf:var(--f-tiktok)}
.card.h-instagram{--st:10.9%;--sb:16.1%;--sl:3.7%;--sr:7.8%;--hf:var(--f-instagram)}
.card.h-youtube{--st:6.3%;--sb:15.6%;--sl:4.4%;--sr:8.9%;--hf:var(--f-youtube)}
.card .bgl{position:absolute;inset:0;z-index:0}
.card .scrim{position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,.62) 0%,rgba(0,0,0,0) 34%),linear-gradient(to bottom,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 18%)}
.card .body{position:absolute;z-index:3;box-sizing:border-box;left:calc(var(--sl) + 12px);right:calc(var(--sr) + 30px);top:calc(var(--st) + 44px);bottom:calc(var(--sb) + 104px);display:flex;flex-direction:column;gap:calc(14px * var(--fit,1));justify-content:flex-start;transition:filter .25s}
.card.l-split .body{top:44%;bottom:calc(var(--sb) + 96px)}
.card.l-bigtext .body,.card.l-captions .body{justify-content:center;padding-bottom:6%}
.card .splittop{position:absolute;left:0;right:0;top:0;height:42%;z-index:2;overflow:hidden;border-bottom:3px solid #000}

/* hook pill: the first thing read, top of the safe zone */
.card .hook{align-self:flex-start;max-width:100%;box-sizing:border-box;padding:7px 13px;border-radius:10px;font-size:calc(16.5px * var(--fit,1));font-weight:800;background:var(--panel);color:var(--fg);line-height:1.22;letter-spacing:-.1px}
.card .q{margin:0;line-height:1.02;overflow-wrap:normal;word-break:normal;hyphens:manual;font-weight:900}
.card .tag{display:inline}

/* ---- looks: text treatments borrowed from creator tools ---- */
/* caption: heavy captions, outlined for any background, key words in yellow */
.card.k-caption .q{font-family:var(--hf);font-weight:900;text-transform:uppercase;font-size:34px;letter-spacing:-.2px;
  text-shadow:0 0 1px #000,2px 2px 0 #000,-2px 2px 0 #000,2px -2px 0 #000,-2px -2px 0 #000,0 4px 10px rgba(0,0,0,.45)}
.card.k-caption .q em{font-style:normal;color:var(--acc)}
/* subtitle: text on rounded highlight boxes, one box per line (creator "text background" style) */
.card.k-subtitle .q{font-family:var(--hf);font-weight:800;font-size:27px;line-height:1.42}
.card.k-subtitle .q span{background:#fff;color:#111;padding:2px 9px;border-radius:8px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.card.k-subtitle .q em{font-style:normal;background:var(--acc);color:#111;border-radius:6px;padding:0 4px}
.card.k-subtitle .hook{background:#111;color:#fff}
/* clean: editorial serif on paper-white */
.card.k-clean .q{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:31px;line-height:1.08;letter-spacing:-.3px}
.card.k-clean .q em{font-style:italic;color:var(--acc)}
/* neon: glow */
.card.k-neon .q{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:36px;letter-spacing:.4px;line-height:1.1;text-shadow:0 0 18px var(--acc),0 0 3px #fff}
.card.k-neon .q em{font-style:normal;color:var(--acc)}
/* paper: handwritten notes on ruled paper */
.card.k-paper .q{font-family:'Caveat','Comic Sans MS',cursive;font-weight:700;font-size:40px;line-height:1.02}
.card.k-paper .q em{font-style:normal;background:linear-gradient(transparent 55%,color-mix(in srgb,var(--acc) 55%,transparent) 55%)}
/* sheet: light looks float as a notes page over the footage */
.card.sheet .body{background:var(--sheet);border-radius:18px;padding:18px 16px 16px;bottom:auto;max-height:calc(100% - var(--st) - 44px - var(--sb) - 104px);box-shadow:0 24px 48px -20px rgba(0,0,0,.85);transform:rotate(-.6deg)}
.card.sheet.l-bigtext .body,.card.sheet.l-captions .body{top:calc(var(--st) + 70px);max-height:calc(100% - var(--st) - 70px - var(--sb) - 104px)}
.card.sheet.rv.mp .body{top:calc(var(--st) + 44px);max-height:calc(100% - var(--st) - 44px - var(--sb) - 104px)}
.card.sheet.k-paper .body{background:linear-gradient(90deg,transparent 30px,rgba(228,87,46,.5) 30px,rgba(228,87,46,.5) 32px,transparent 32px),var(--sheet);padding-left:42px;--rule:rgba(47,107,255,.25)}
.card.sheet.k-paper.night .body{background:var(--sheet);padding-left:16px;--rule:rgba(255,255,255,.08)}
/* a rule under each line of handwriting, so the writing sits on the lines instead of being crossed by them (mirrors CardView's ruled body) */
.card.sheet.k-paper .q,.card.sheet.k-paper .pt .tx,.card.sheet.k-paper .beat{background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(.86lh - 1px),var(--rule) calc(.86lh - 1px),var(--rule) .86lh,transparent .86lh,transparent 1lh)}
/* chat bubbles carry their own surface: no sheet behind them, whatever the look */
.card.sheet.l-chat .body{background:none!important;box-shadow:none;padding:0!important;transform:none;bottom:calc(var(--sb) + 104px)}
.card.sheet .reveal{color:var(--fg);text-shadow:none}
.card.sheet .ring{background:rgba(255,255,255,.7)}
.card.sheet.night .ring{background:rgba(0,0,0,.3)}
.card .coach{position:absolute;z-index:9;left:calc(var(--sl) + 10px);right:calc(var(--sr) + 64px);bottom:calc(var(--sb) + 72px);background:rgba(255,255,255,.96);color:#111;font-size:13px;line-height:1.3;font-weight:800;padding:9px 14px;border-radius:16px;box-shadow:0 10px 24px -10px rgba(0,0,0,.7);animation:coach 4.2s ease forwards;pointer-events:none}
@keyframes coach{0%{opacity:0;transform:translateY(8px)}10%,80%{opacity:1;transform:none}100%{opacity:0}}

/* reveal ring + answer */
.card .snd{align-self:flex-start;background:var(--acc);color:var(--accfg,#111);border:none;border-radius:20px;padding:9px 18px 9px 16px;font:inherit;font-size:14px;font-weight:700;margin-top:12px;cursor:pointer}
.card .reveal{align-self:flex-start;display:flex;align-items:center;gap:10px;background:none;border:none;color:var(--fg);padding:0;font:inherit;font-size:14.5px;font-weight:700;min-height:56px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.card .hintchip{align-self:flex-start;max-width:100%;background:#fff;color:#111;border-radius:12px 12px 12px 4px;padding:7px 11px;font-size:14px;font-weight:700;box-shadow:0 8px 20px -10px rgba(0,0,0,.6);animation:drop .25s ease-out}
.card .hintchip b{color:#e4572e;margin-right:4px}
.card .ring{width:52px;height:52px;border-radius:50%;border:3px solid var(--acc);color:var(--acc);display:flex;align-items:center;justify-content:center;font-family:var(--hf);font-weight:900;font-size:22px;background:rgba(0,0,0,.25);position:relative}
.card .ring::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:3px solid transparent;border-top-color:#fff;animation:spin 3s linear forwards}
@keyframes spin{to{transform:rotate(1080deg)}}
.card .ans{padding:13px 15px;border-radius:16px;display:flex;flex-direction:column;gap:4px;background:var(--acc);color:var(--accfg);animation:drop .32s cubic-bezier(.2,1.4,.4,1);box-shadow:0 10px 24px -12px rgba(0,0,0,.6)}
@keyframes drop{from{transform:translateY(-10px) scale(.94);opacity:0}to{transform:none;opacity:1}}
.card .ans .a1{font-weight:900;font-size:calc(20px * var(--fit,1));line-height:1.15}
.card .ans .a2{font-size:calc(14.5px * var(--fit,1));line-height:1.35;font-weight:500}

/* captions: auto-caption beats, one at a time */
.card .q.keepcase,.card .beat.keepcase{text-transform:none} /* Na+, pH, mEq/L keep their capitals (RC.caseMatters) */
.card .beat{font-family:var(--hf);font-weight:900;font-size:40px;line-height:1.02;text-transform:uppercase;text-align:center;align-self:center;margin-top:14%;
  text-shadow:0 0 1px #000,3px 3px 0 #000,-3px 3px 0 #000,3px -3px 0 #000,-3px -3px 0 #000;animation:beat .18s ease-out}
.card .beat em{font-style:normal;color:var(--acc)}
.card.k-subtitle .beat{text-shadow:none}
.card.k-subtitle .beat span{background:#fff;color:#111;padding:2px 10px;border-radius:9px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.card.k-paper .beat{font-family:'Caveat',cursive;text-transform:none;text-shadow:none;color:var(--fg)}
.card.k-clean .beat{font-family:'Fraunces',serif;text-transform:none;text-shadow:none;font-size:34px}
@keyframes beat{from{transform:scale(.86);opacity:.2}to{transform:none;opacity:1}}
.card .beatcount{align-self:center;display:flex;gap:4px}.card .beatcount i{width:18px;height:3px;border-radius:2px;background:rgba(255,255,255,.35)}.card .beatcount i.on{background:#fff}

/* chat: a phone chat thread */
.card .chat{border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--panel);box-shadow:0 18px 40px -20px rgba(0,0,0,.7)}
.card .chathead{display:flex;align-items:center;gap:10px;padding-bottom:6px;border-bottom:1px solid rgba(127,127,127,.2);margin-bottom:2px}
.card .chathead i{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#ff8a3d,#ff3b5c);color:#fff;font-style:normal;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
.card .chathead b{display:block;font-size:14px}.card .chathead small{font-size:11px;opacity:.6}
.card .bub{max-width:84%;padding:8px 12px;border-radius:18px;font-size:14.5px;line-height:1.3;font-family:var(--hf)}
.card .bub.them{align-self:flex-start;border-bottom-left-radius:5px;background:var(--bubble);color:var(--fg)}
.card .bub.me{align-self:flex-end;border-bottom-right-radius:5px;background:var(--acc);color:var(--accfg);animation:drop .3s ease-out both}
.card .typing{align-self:flex-end;border:none;min-height:44px;padding:6px 18px;border-radius:18px;border-bottom-right-radius:5px;background:var(--acc);color:var(--accfg);font-weight:900;letter-spacing:3px;font-size:18px}
.card .typing span{display:inline-block;animation:dot 1s infinite}.card .typing span:nth-child(2){animation-delay:.15s}.card .typing span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{transform:none;opacity:.6}30%{transform:translateY(-4px);opacity:1}}

.card .chat{max-height:100%;min-height:0;box-sizing:border-box}
/* a chat that gets long scrolls its oldest messages off the top, like a real thread */
.card .msgs{display:flex;flex-direction:column;gap:6px;justify-content:flex-end;overflow:hidden;min-height:0;flex:1 1 auto}
.card .msgs.over{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 36px);mask-image:linear-gradient(to bottom,transparent 0,#000 36px)}
.card button.bub{border:none;font:inherit;font-family:var(--hf);font-size:14.5px;text-align:left;position:relative;cursor:pointer}
.card .bub .tb{position:absolute;top:-10px;left:-10px;width:22px;height:22px;border-radius:50%;background:var(--panel);color:var(--acc);border:2px solid var(--acc);font-style:normal;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;animation:pop2 .3s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop2{from{transform:scale(.2)}to{transform:none}}
.card .bub.late,.card .sysmsg{animation:drop .3s ease-out both}
.card .sysmsg{align-self:center;font-size:11.5px;font-weight:700;opacity:.75;padding:2px 0}

/* comment: "replying to" sticker */
.card .sticker{align-self:flex-start;max-width:92%;background:#fff;color:#111;border-radius:14px;padding:10px 12px;display:flex;gap:9px;align-items:flex-start;box-shadow:0 10px 26px -10px rgba(0,0,0,.6);transform:rotate(-1.5deg)}
.card .sticker i{width:26px;height:26px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,#6fd3ff,#2f6bff)}
.card .sticker small{display:block;font-size:11.5px;color:#666;font-weight:600}
.card .sticker span{font-size:15px;font-weight:700;line-height:1.25}

/* quiz: poll sticker */
.card .poll{background:#fff;color:#111;border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 14px 30px -14px rgba(0,0,0,.7)}
.card .poll .pq{font-weight:800;font-size:16px;line-height:1.25;padding:2px 4px 4px}
.card .opt{min-height:50px;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;border:2px solid #e3e3e8;background:#f4f4f6;color:#111;font:inherit;font-size:15.5px;font-weight:700;text-align:left;width:100%}
.card .opt .l{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;flex-shrink:0;background:#111;color:#fff}
.card .opt.right{border-color:#1fa463;background:#e3f7ec}.card .opt.right .l{background:#1fa463}
.card .opt.wrong{border-color:#e23b55;background:#fde7eb}.card .opt.wrong .l{background:#e23b55}
.card .opt.dim{opacity:.45}
.card .pollnote{font-size:13.5px;line-height:1.35;color:#333;padding:0 4px}

/* ---- long answers ----
   Points drop in one after another (the "3 things…" listicle), each with a tick for self-marking.
   A long question's set-up sits in a quoted box. The fit pass (data-fit) shrinks everything a step
   at a time if the content would spill out of the safe zone. */
.card[data-fit="1"]{--fit:.92}.card[data-fit="2"]{--fit:.84}.card[data-fit="3"]{--fit:.76}.card[data-fit="4"]{--fit:.68}.card[data-fit="5"]{--fit:.6}
/* the clamp clips at the padding edge, so the vertical space is transparent border: no half line shows under the last one */
.card .ctx{font-size:calc(15px * var(--fit,1));line-height:1.32;font-weight:600;padding:0 12px;border:8px solid transparent;border-left:3px solid var(--acc);border-right:0;background:var(--panel);border-radius:4px 12px 12px 4px;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:6;overflow:hidden;flex-shrink:0}
.card.rv.mp .ctx{-webkit-line-clamp:1;opacity:.8}
.card.sheet .ctx{background:rgba(127,127,127,.12)}
.card.k-subtitle .ctx{background:#111;color:#fff}
.card .marks{align-self:flex-start;font-size:12px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;padding:4px 10px;border-radius:8px;border:2px solid var(--acc);color:var(--acc);background:rgba(0,0,0,.35);line-height:1.2}
.card.sheet .marks{background:none}
.card.l-bigtext .marks,.card.l-captions .marks{align-self:flex-start}
.card.rv.mp .hook{display:none}
.card .pts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:calc(7px * var(--fit,1))}
.card .pts li{position:relative}
.card .pt{width:100%;display:flex;align-items:flex-start;gap:10px;text-align:left;box-sizing:border-box;padding:calc(9px * var(--fit,1)) 10px calc(9px * var(--fit,1)) 9px;border-radius:14px;border:2px solid transparent;
  background:var(--panel);color:var(--fg);font-family:var(--hf);font-weight:700;font-size:calc(var(--ptpx,16px) * var(--fit,1));line-height:1.24;cursor:pointer;
  animation:ptin .42s cubic-bezier(.2,1.25,.4,1) both;box-shadow:0 8px 20px -14px rgba(0,0,0,.7);transition:border-color .15s,background .15s}
@keyframes ptin{from{opacity:0;transform:translateY(12px) scale(.95)}to{opacity:1;transform:none}}
.card .pt .n{flex-shrink:0;min-width:24px;height:24px;border-radius:7px;background:var(--acc);color:var(--accfg);font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;font-family:var(--hf)}
.card .pt .tx{flex:1;min-width:0;padding-top:1px}
.card .pt .tx b{color:var(--acc);font-weight:900}
.card .pt .tk{flex-shrink:0;width:20px;height:20px;border-radius:50%;border:2px solid currentColor;opacity:.4;position:relative;margin-top:1px}
.card .pt.got{border-color:var(--acc)}
.card .pt.got .tk{opacity:1;background:var(--acc);border-color:var(--acc)}
.card .pt.got .tk::after{content:"";position:absolute;left:5.5px;top:1.5px;width:5px;height:10px;border:solid var(--accfg);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.card .pts.steps .n{border-radius:50%}
.card .pts.steps li:not(:last-child)::after{content:"";position:absolute;left:22px;top:calc(100% - 3px);height:calc(7px * var(--fit,1) + 6px);width:2px;background:var(--acc);z-index:1}
.card .pt.slot{animation:none;align-items:center;box-shadow:none;cursor:default}
.card .redact{display:block;height:.9em;border-radius:5px;background:repeating-linear-gradient(135deg,currentColor 0 5px,transparent 5px 9px);opacity:.32}
.card .hintx{opacity:.9;font-style:italic}
.card .selfcheck{align-self:flex-start;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;padding:5px 11px;border-radius:999px;background:rgba(0,0,0,.5);color:#fff;animation:ptin .42s ease both;text-shadow:none}
.card .selfcheck::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid currentColor;opacity:.7}
.card.sheet .selfcheck{background:rgba(127,127,127,.16);color:var(--fg)}
.card .selfcheck.on::before{background:var(--acc);border-color:var(--acc);opacity:1}
.card.settled .pt,.card.settled .selfcheck,.card.settled .bub.me,.card.settled .bub.late,.card.settled .sysmsg,.card.settled .ans{animation:none!important}
.card .ans.t2 .a1{font-size:calc(18px * var(--fit,1))}
.card .ans.t3 .a1{font-size:calc(16.5px * var(--fit,1));font-weight:800}
/* looks */
.card.k-caption .pt{background:rgba(0,0,0,.62)}
.card.k-subtitle .pt{background:#fff;color:#111}
.card.k-subtitle .pt .n{color:#111}
.card.k-subtitle .pt .tx b{color:#111;background:var(--acc);border-radius:4px;padding:0 3px}
.card.k-neon .pt{border-color:color-mix(in srgb,var(--acc) 45%,transparent);box-shadow:0 0 18px -6px var(--acc)}
.card.k-neon .pt.got{border-color:var(--acc)}
.card.sheet .pt{background:none;box-shadow:none;border:none;border-radius:8px;padding-left:2px;padding-right:4px;border-bottom:1.5px dashed rgba(127,127,127,.35)}
.card.sheet .pt.got{background:color-mix(in srgb,var(--acc) 16%,transparent);border-bottom-color:transparent}
.card.sheet .pt.slot{border-bottom-style:solid}
.card.k-clean .pt{font-family:'Fraunces',Georgia,serif;font-weight:600;line-height:1.2}
.card.k-paper .pt{font-family:'Caveat',cursive;font-weight:700;font-size:calc(var(--ptpx,16px) * 1.38 * var(--fit,1));line-height:1.02;padding-top:4px;padding-bottom:4px}
.card.k-paper .pt .n{background:none;color:var(--acc);font-family:'Caveat',cursive;font-size:25px;min-width:16px;height:auto;line-height:1}
.card.k-paper .pts.steps li:not(:last-child)::after{left:9px;opacity:.5}
.card.k-paper .pt .tx b{color:var(--fg);background:linear-gradient(transparent 55%,color-mix(in srgb,var(--acc) 45%,transparent) 55%)}
/* "more": the explanation opens over a dimmed card, like an expanded caption */

  background:linear-gradient(90deg,#8a5a3c 0 12%,#3b3f4a 12% 33%,#f2f2f2 33% 34%,#3b3f4a 34% 66%,#f2f2f2 66% 67%,#3b3f4a 67% 88%,#8a5a3c 88%),

<script>"use strict";
/* Reelcards engine, JavaScript port of engine/src/main/java/com/reelcards/engine (same rules, same numbers).
   Kept deliberately close to the Java so the browser demo and the Android app behave the same. */
"use strict";
const RC = (function(){
const MIN = 60000, DAY = 86400000, SESSION_GAP = 10 * MIN, ABSORBED_SEC = 25, SKIMMING_SEC = 3;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const NEW = 0, LEARNING = 1, REVIEW = 2, RELEARNING = 3, LEECH_LAPSES = 6;
const STATE = ["new", "learning", "review", "relearning"];
const G = {again: 1, hard: 2, good: 3, easy: 4};
const GL = ["", "again", "hard", "good", "easy"];

/* ---------------- random ---------------- */
function randn(rnd){let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function gamma(rnd,k){if(k<1)return gamma(rnd,k+1)*Math.pow(rnd(),1/k);const d=k-1/3,c=1/Math.sqrt(9*d);for(;;){let x,v;do{x=randn(rnd);v=1+c*x;}while(v<=0);v=v*v*v;const u=rnd();if(u<1-.0331*x*x*x*x)return d*v;if(Math.log(u)<.5*x*x+d*(1-v+Math.log(v)))return d*v;}}
function beta(rnd,a,b){const x=gamma(rnd,a),y=gamma(rnd,b);return x/(x+y);}
const pickOf = (rnd, a) => a[Math.floor(rnd() * a.length)];

/* ---------------- FSRS-6 (py-fsrs defaults) ---------------- */
const DEFAULT_W = [0.212,1.2931,2.3065,8.2956,6.4133,0.8334,3.0194,0.001,1.8722,0.1666,0.796,1.4835,0.0614,0.2629,1.6483,0.6014,1.8729,0.5425,0.0912,0.0658,0.1542];
const FUZZ = [[2.5,7,0.15],[7,20,0.1],[20,Infinity,0.05]];
function Fsrs(rnd){
  this.w = DEFAULT_W.slice(); this.learningSteps=[1*MIN,10*MIN]; this.relearningSteps=[10*MIN];
  this.maxIntervalDays=365; this.fuzz=true; this.personalScale=1; this.rnd=rnd;
}
Fsrs.prototype = {
  decay(){return -this.w[20];}, factor(){return Math.pow(0.9,1/this.decay())-1;},
  R(el,s){ if(s<=0)return 0; return Math.pow(1+this.factor()*Math.max(0,el)/s,this.decay()); },
  I(s,r){ return s/this.factor()*(Math.pow(r,1/this.decay())-1); },
  initS(g){return Math.max(0.001,this.w[g-1]);},
  initD(g,cl){const d=this.w[4]-Math.exp(this.w[5]*(g-1))+1;return cl?clamp(d,1,10):d;},
  nextD(d,g){const delta=-(this.w[6]*(g-3));const damped=d+(10-d)*delta/9;return clamp(this.w[7]*this.initD(4,false)+(1-this.w[7])*damped,1,10);},
  shortS(s,g){let inc=Math.exp(this.w[17]*(g-3+this.w[18]))*Math.pow(s,-this.w[19]);if(g!==1)inc=Math.max(inc,1);return Math.max(0.001,s*inc);},
  recallS(d,s,r,g){const w=this.w;return s*(1+Math.exp(w[8])*(11-d)*Math.pow(s,-w[9])*(Math.exp((1-r)*w[10])-1)*(g===2?w[15]:1)*(g===4?w[16]:1));},

    if (n < s.beats.length && !it.revealed) {
      const words = s.beats[n].split(" "), hi = s.hl[n];
      const upper = it.f.look !== "paper" && it.f.look !== "clean" && !RC.caseMatters(s.q);
      const inner = s.cloze ? gapify(esc(upper?s.beats[n].toUpperCase():s.beats[n])) : words.map((w,k)=> k===hi ? "<em>"+esc(upper?w.toUpperCase():w)+"</em>" : esc(upper?w.toUpperCase():w)).join(" ");
      const bl = Math.max(...words.map(w=>w.length)), bpx = Math.round(Math.min(40, 250 / (bl * (upper ? .66 : .5))));

  if (s.io) return pictureHTML(it)+questionHTML(it, .8)+revealOrAnswer(it);

}

  // the progress line runs for as long as the card takes to read

/* A picture full screen (mirrors CardView.zoom): pinch, scroll or double-click to zoom, drag to move, and a
   Close button back to the card. It's added to `host`, which must be positioned and outlive the card's redraws. */
function zoomIn(host, src){
  if (host.querySelector(".zoomer")) return null;
  const z = document.createElement("div"); z.className = "zoomer";
  z.innerHTML = '<img src="'+esc(src)+'" alt="Picture. Pinch or double-click to zoom, drag to move." draggable="false"><button class="zx" type="button" aria-label="Close the picture and go back to the card">✕ Close</button><span class="zt">Pinch, scroll or double-tap to zoom</span>';
  const img = z.querySelector("img"), pts = new Map();
  let k = 1, x = 0, y = 0, d0 = 0, k0 = 1;
  const apply = () => { k = Math.max(1, Math.min(6, k)); if (k === 1) x = y = 0; img.style.transform = "translate("+x+"px,"+y+"px) scale("+k+")"; };
  z._wheel = e => { k *= e.deltaY < 0 ? 1.18 : 1/1.18; apply(); };
  z.addEventListener("wheel", e => { e.preventDefault(); e.stopPropagation(); z._wheel(e); }, {passive:false});
  z.addEventListener("dblclick", e => { e.stopPropagation(); k = k > 1.05 ? 1 : 3; apply(); });
  z.addEventListener("pointerdown", e => { if (e.target.closest(".zx")) return; pts.set(e.pointerId, e); try { z.setPointerCapture(e.pointerId); } catch (err) {} if (pts.size === 2) { const [a, b] = [...pts.values()]; d0 = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY); k0 = k; } });
  z.addEventListener("pointermove", e => {
    const prev = pts.get(e.pointerId); if (!prev) return; pts.set(e.pointerId, e);
    if (pts.size === 2) { const [a, b] = [...pts.values()]; k = k0 * Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY) / (d0 || 1); apply(); }
    else if (k > 1) { x += e.clientX - prev.clientX; y += e.clientY - prev.clientY; apply(); }
  });
  const lift = e => pts.delete(e.pointerId);
  z.addEventListener("pointerup", lift); z.addEventListener("pointercancel", lift);
  z.addEventListener("click", e => { e.stopPropagation(); if (e.target.closest(".zx")) z.remove(); });
  host.appendChild(z);
  return z;
}
return {card, plainReel, esc, LOOKS, I, thinkSecs, ptDelays, zoomIn};

function parseNotes(text,deck){
  const out={cards:[],skipped:0};const lines=String(text||"").replace(/\r\n?/g,"\n").split("\n");let pq=null;
  const words=s=>s.trim()?s.trim().split(/\s+/).length:0;
  const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
  const lf=s=>{if(!s)return s;if(s.length>1&&/[A-Z]/.test(s[1]))return s;const first=s.split(/\s+/)[0];if(first.length>1&&/[A-Z]/.test(first.slice(1)))return s;return s[0].toLowerCase()+s.slice(1);};
  const asQ=f=>{f=f.trim();if(f.endsWith("?"))return f;if(words(f)<=5&&!/[“"]/.test(f)){const acr=f.length>1&&f===f.toUpperCase();return "What is "+(acr?f:lf(f))+"?";}return f;};
  const add=(f,b,x)=>{f=f.trim();b=b.trim();if(!f||!b||f.length>200||b.length>220){out.skipped++;return;}let h=0;const key=deck+"|"+f+"|"+b;for(let i=0;i<key.length;i++)h=(h*31+key.charCodeAt(i))|0;out.cards.push(makeCard("notes-"+(h>>>0).toString(16),deck,f,b,x||""));};
  for(const raw of lines){
    let line=raw.replace(/<[^>]+>/g," ").replace(/\*\*/g,"").replace(/&nbsp;/g," ").replace(/&amp;/g,"&").replace(/^\s*(?:[-*•·▪◦]|\d+[.)]|[a-z][.)])\s+/,"");
    line=line.split("\t").map(p=>p.replace(/\s+/g," ").trim()).join("\t").trim();
    if(!line||line.startsWith("#"))continue;
    let m=line.match(/^(?:q|question)\s*\d{0,3}\s*[:.]\s*([\s\S]*)$/i);
    if(m){if(pq!==null)out.skipped++;pq=m[1].trim();continue;}
    m=line.match(/^(?:a|answer)\s*\d{0,3}\s*[:.]\s*([\s\S]*)$/i);
    if(m){if(pq&&m[1].trim())add(pq,m[1],"");else out.skipped++;pq=null;continue;}
    if(pq!==null){out.skipped++;pq=null;}
    if(line.endsWith(":")){out.skipped++;continue;} // a heading, or a chatbot's "Here are your flashcards:"

/* The colour field behind the sea: a deep base with three soft blobs of colour drifting over it. Every 18
   seconds it eases into the next palette (ocean, dusk, lagoon, indigo, aurora, rose, deep sea, twilight), and it starts at a palette that
   follows the hour, so the app's colours move on as time goes on, like Reelcards itself changing shape

  {base:[26,16,56], b:[[91,63,208],[190,60,170],[96,165,250],[236,72,153]]}, // dusk
  {base:[8,38,46], b:[[14,159,142],[45,212,191],[56,189,248],[16,185,129]]}, // lagoon
  {base:[13,28,70], b:[[67,56,202],[14,165,233],[167,139,250],[217,70,239]]}, // indigo
  {base:[6,26,30], b:[[16,185,129],[124,58,237],[34,211,238],[163,230,53]]}, // aurora
  {base:[32,10,38], b:[[219,39,119],[147,51,234],[59,130,246],[251,113,133]]}, // rose
  {base:[5,18,42], b:[[14,116,144],[30,64,175],[94,234,212],[168,85,247]]}, // deep sea
  {base:[20,18,52], b:[[59,130,246],[236,72,153],[45,212,191],[129,140,248]]} // twilight

/* The same sea as a full-screen backdrop for a page with no phone frame (the Reelcards Feed). It sits behind

function seaBackdrop(){
  const cv = document.createElement("canvas"); cv.setAttribute("aria-hidden", "true");

  function size(){
    W = innerWidth; H = innerHeight; const dpr = Math.min(2, window.devicePixelRatio || 1); cv.width = W*dpr; cv.height = H*dpr; g.setTransform(dpr,0,0,dpr,0,0);
    const G = Math.max(9, Math.sqrt(W*H/4500)); let seed = 7; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
    pts = []; for (let y=-G; y<H+G; y+=G) for (let x=-G; x<W+G; x+=G) pts.push([x+rnd()*G*.8, y+rnd()*G*.8, 4+rnd()*4, rnd(), rnd()*6.28]);

/* ---------------- gestures (as in the app, the web demo and the extension) ---------------- */
const el = it => it.shownAt ? performance.now() - it.shownAt : 0;
const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };
let sound = null;
function stopSound(){ if (sound && sound.pause) { try { sound.pause(); } catch (e) {} } sound = null; try { speechSynthesis.cancel(); } catch (e) {} }
function play(url){ stopSound(); if (typeof url !== "string" || url.indexOf("tts:") !== 0) return;
  try { const i = url.indexOf(":", 4), u = new SpeechSynthesisUtterance(url.slice(i + 1)); u.lang = url.slice(4, i).replace("_", "-"); speechSynthesis.speak(u); } catch (e) {} }
function startTimers(slide){
  const it = slide._item; if (!it || it.revealed || it.done) return;
  if (it.f.layout === "captions" && it.s.beats.length && (it.beat||0) < it.s.beats.length) {
    const words = it.s.beats[it.beat||0].split(" ").length;
    timers.push(setTimeout(() => { if (active === slide && !it.revealed && !it.done) { it.beat = (it.beat||0) + 1; draw(slide); } }, 380 + 330*words)); return;
  }
  if (it.count == null) it.count = Render.thinkSecs(it.s);
  if (it.count > 0) timers.push(setTimeout(() => { if (active === slide && !it.revealed && !it.done) { it.count--; const r = slide.querySelector(".ring"); if (r) r.textContent = it.count > 0 ? it.count : "?"; startTimers(slide); } }, 1000));
}
function reveal(slide){
  const it = slide._item; if (!it || it.done) return;
  if (it.moreOpen) { it.moreOpen = false; draw(slide); return; }
  if (it.revealed) { if (!it.settled) { it.settled = true; draw(slide); } return; }
  if (it.f.layout === "quiz" && it.s.correct >= 0) return;
  it.revealed = true; it.revealAt = el(it); draw(slide);
  if (it.s.asnd) play(it.s.asnd);
  timers.push(setTimeout(() => { it.settled = true; }, Render.ptDelays(it.s).pop() + 600));
}
function like(slide){
  const it = slide._item; if (!it || it.done || it.liked) return;
  it.liked = true; it.likeAt = el(it); it.likedBefore = !it.revealed && it.pick < 0; if (it.revealed) it.settled = true; draw(slide);
  if (it.likedBefore && it.f.layout !== "quiz") setTimeout(() => { if (!it.done && !it.revealed) { it.revealed = true; it.revealAt = el(it); draw(slide); } }, 600);
}
function tick(slide, i){
  const it = slide._item; if (!it || it.done || !it.revealed || !it.s.points || it.s.points.length < 2) return;
  if (it.liked) { it.got = it.s.points.map(() => true); it.liked = false; it.likedBefore = false; }
  it.got[i] = !it.got[i]; it.settled = true; draw(slide);
}
function toast(slide, msg){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; slide.querySelector(".stage").appendChild(t); setTimeout(() => t.remove(), 1800); }
function onClick(e){
  const slide = e.target.closest(".cardslide"); if (!slide || !slide._item) return;
  const it = slide._item; if (it.done) return;
  const z = e.target.closest(".zoomer"); if (z) return;
  const b = e.target.closest("[data-act]");
  if (b) {
    const a = b.dataset.act, v = b.dataset.v;
    switch (a) {
      case "like": like(slide); return;
      case "reveal": reveal(slide); return;
      case "sound": play(v === "a" ? it.s.asnd : it.s.snd); return;
      case "tick": if (!it.settled && parseFloat(getComputedStyle(b).opacity) < .99) { it.settled = true; draw(slide); return; } tick(slide, +v); return;
      case "more": it.moreOpen = !it.moreOpen; it.settled = true; draw(slide); return;
      case "pick": if (it.pick < 0) { it.pick = +v; it.pickAt = el(it); it.revealed = true; draw(slide); } return;
      case "hint": if (!it.hinted && !it.revealed && it.pick < 0) { it.hinted = true; it.hintAt = el(it); draw(slide); } return;
      case "save": if (!it.saved) { it.saved = true; toast(slide, "Saved: it'll come back within a day"); } return;
      case "share": it.shared = true; try { navigator.clipboard.writeText("Can you answer this? “" + it.s.q + "” · made with Reelcards").then(() => toast(slide, "Copied: paste it to a friend"), () => {}); } catch (err) {} return;
    }
    return;
  }
  if (e.target.closest("[data-card]")) {
    clearTimeout(tapTimer);
    const pic = e.target.closest(".pic.zoomable");
    if (pic && pic.dataset.src && it.revealed) tapTimer = setTimeout(() => Render.zoomIn(slide, pic.dataset.src), 260);
    else tapTimer = setTimeout(() => reveal(slide), 260);
  }
}
function onDbl(e){
  const slide = e.target.closest(".cardslide"); if (!slide || !slide._item || e.target.closest("[data-act]")) return;
  clearTimeout(tapTimer); like(slide);
}

/* fit pass: shrink text a step at a time if it would spill out of the safe zone (as in the web demo) */
function fitCards(r){
  r.querySelectorAll(".card").forEach(card => {
    card.removeAttribute("data-fit");
    const body = card.querySelector(".body"); if (!body) return;
    const over = () => { const k = [...body.children].filter(e => e.offsetParent !== null); if (!k.length) return false; const cs = getComputedStyle(body);
      const used = k[k.length-1].offsetTop + k[k.length-1].offsetHeight - k[0].offsetTop;
      return used > body.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) + 2; };
    for (let f = 1; f <= 5 && over(); f++) card.setAttribute("data-fit", f);
  });
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (feed) feed.querySelectorAll(".stage").forEach(fitCards); });

setup();
})();

</script>
</body>
</html>
