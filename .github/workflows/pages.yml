name: Web demo

# Publishes web-demo/ to GitHub Pages so anyone can try Reelcards in a browser, and the privacy policy
# (PRIVACY.md as privacy.html), which Google Play needs at a public address and the app links to.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Until then this workflow skips the deploy instead of failing.
on:
  push:
    branches: [main, master]
    paths: ["web-demo/**", "extension/**", "tools/build-web-demo.py", "PRIVACY.md", "tools/build-privacy-page.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Is GitHub Pages switched on?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" > /dev/null 2>&1; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is off. Turn it on in Settings → Pages → Source: GitHub Actions, then re-run this workflow."
          fi

      - name: Build the page
        if: steps.pages.outputs.on == 'true'
        run: |
          python3 tools/build-web-demo.py
          mkdir -p _site
          cp -r web-demo/index.html web-demo/feed.html web-demo/manifest.webmanifest web-demo/sw.js web-demo/icons _site/
          python3 tools/build-privacy-page.py _site/privacy.html
          mkdir -p _pack/Reelcards-extension && cp -r extension/. _pack/Reelcards-extension/
          (cd _pack && zip -qr ../_site/Reelcards-extension.zip Reelcards-extension)

      - if: steps.pages.outputs.on == 'true'
        uses: actions/configure-pages@v5

      - if: steps.pages.outputs.on == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        if: steps.pages.outputs.on == 'true'
        uses: actions/deploy-pages@v4
